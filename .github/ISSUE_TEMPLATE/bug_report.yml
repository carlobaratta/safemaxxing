name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      description: Output of `sw_vers -productVersion` and `uname -m`.
      placeholder: 27.0.1, arm64
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Source checkout (uv)
        - .pkg from a GitHub release
        - Homebrew formula
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Output of `safemaxxing version`, or `git rev-parse --short HEAD` for a checkout.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tui
        - watch
        - menubar
        - permissions / doctor
        - block / unblock / flush / boot
        - freeze / thaw / kill
        - packaging / release
        - other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Output of `sudo uv run safemaxxing doctor`.
      render: text
  - type: checkboxes
    id: root
    attributes:
      label: Privileges
      options:
        - label: I ran safemaxxing as root (sudo)
