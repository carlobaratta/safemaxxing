name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      description: Output of `sw_vers -productVersion` and `uname -m`.
      placeholder: 27.0.1, arm64
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Output of `sudo uv run safemaxxing doctor`.
      render: text
  - type: checkboxes
    id: root
    attributes:
      label: Privileges
      options:
        - label: I ran safemaxxing as root (sudo)
