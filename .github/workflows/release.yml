name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, macos-15-intel]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); macos-15-intel is x86_64. One build each.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # With none of the 8 secrets the build is unsigned (tarball only, no .pkg). With some but
      # not all, fail before any setup, naming each missing secret (never its value): otherwise
      # the first sign of one is `security import` rejecting an empty .p12.
      - name: Check signing and notarization secrets
        id: secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
        run: |
          names="MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
            MACOS_SIGN_IDENTITY MACOS_INSTALLER_IDENTITY
            AC_API_KEY_ID AC_API_ISSUER_ID AC_API_PRIVATE_KEY"
          set=0 missing=""
          for name in $names; do
            if [ -n "${!name}" ]; then set=$((set + 1)); else missing="$missing $name"; fi
          done
          if [ "$set" -eq 0 ]; then
            echo "::notice title=Unsigned build::no signing secrets set; building an unsigned tarball without a .pkg"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in $missing; do
            echo "::error title=Missing secret::$name is not set; see packaging/README.md#required-repository-secrets"
          done
          [ -z "$missing" ] || exit 1
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      # The menubar extra (rumps + PyObjC) goes into the bundle; the spec refuses to build without it.
      - run: uv sync --locked --extra menubar
      - run: uv pip install pyinstaller

      - name: Import Developer ID signing identities
        if: steps.secrets.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          # Remove the certificate even when a later command fails, and keep it owner-only.
          trap 'rm -f "$cert"' EXIT
          umask 077
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build, sign and package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: ./packaging/build_release.sh

      - name: Notarize and staple the installer
        if: steps.secrets.outputs.signed == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/ac_api_key.p8"
          # Remove the key even when notarization fails, and keep it owner-only.
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$AC_API_PRIVATE_KEY" > "$key"
          pkg="$(ls dist/safemaxxing-*.pkg)"
          xcrun notarytool submit "$pkg" \
            --key "$key" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"

      - name: Record checksums
        run: |
          shasum -a 256 dist/safemaxxing-*.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safemaxxing-${{ matrix.os }}
          path: |
            dist/safemaxxing-*.tar.gz
            dist/safemaxxing-*.pkg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: Formula
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      # The tap's formula with this release's version and real checksums, attached to the
      # release so the tap is updated from it instead of by hand.
      - name: Fill in the Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version is the package's (__init__.py), which a test tag like v0.2.1-rc1 need
          # not match; the URLs point at this tag's release either way.
          version="$(find artifacts -type f -name 'safemaxxing-*-arm64.tar.gz' \
            | sed -n 's/.*safemaxxing-\(.*\)-arm64\.tar\.gz$/\1/p' | head -1)"
          [ -n "$version" ] || { echo "::error::no arm64 tarball"; exit 1; }
          sha() {
            f="$(find artifacts -type f -name "safemaxxing-$version-$1.tar.gz")"
            [ -n "$f" ] || { echo "::error::no $1 tarball for $version"; exit 1; }
            sha256sum "$f" | cut -d' ' -f1
          }
          arm="$(sha arm64)"
          intel="$(sha x86_64)"
          mkdir -p artifacts/formula
          awk -v v="$version" -v tag="$TAG" -v arm="$arm" -v intel="$intel" '
            /^  version "/ { sub(/"[^"]*"/, "\"" v "\"") }
            /url "/ { gsub(/v[0-9][^\/]*\/safemaxxing-[^-]*-/, tag "/safemaxxing-" v "-") }
            /on_arm do/ { arch = arm } /on_intel do/ { arch = intel }
            /sha256 "/ { sub(/"[^"]*"/, "\"" arch "\"") }
            { print }
          ' Formula/safemaxxing.rb > artifacts/formula/safemaxxing.rb
          cat artifacts/formula/safemaxxing.rb >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          files="$(find artifacts -type f \( -name 'safemaxxing-*.tar.gz' -o -name 'safemaxxing-*.pkg' -o -name 'safemaxxing.rb' \))"
          # Before 1.0 every release is an alpha, and a tag with a suffix (v1.0.0-rc1) is a test
          # release: both are pre-releases, never the latest one.
          title="safemaxxing ${TAG#v}"
          flags="--latest"
          case "$TAG" in
            v0.*) title="$title (alpha)"; flags="--prerelease --latest=false" ;;
            *-*) flags="--prerelease --latest=false" ;;
          esac
          notes=""
          if ! printf '%s\n' "$files" | grep -q '\.pkg$'; then
            notes="Unsigned build: no Developer ID signature, no notarization and no .pkg. On first run macOS blocks the binary; allow it with \`xattr -dr com.apple.quarantine\` on the extracted folder."
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$title" \
            --notes "$notes" \
            --generate-notes \
            $flags \
            $files
