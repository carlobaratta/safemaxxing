name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, macos-15-intel]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); macos-15-intel is x86_64. One build each.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The menubar extra (rumps + PyObjC) goes into the bundle; the spec refuses to build without it.
      - run: uv sync --locked --extra menubar
      - run: uv pip install pyinstaller

      - name: Import Developer ID signing identities
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      - name: Build, sign and package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: ./packaging/build_release.sh

      - name: Notarize and staple the installer
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/ac_api_key.p8"
          printf '%s' "$AC_API_PRIVATE_KEY" > "$key"
          pkg="$(ls dist/safemaxxing-*.pkg)"
          xcrun notarytool submit "$pkg" \
            --key "$key" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          rm -f "$key"

      - name: Record checksums
        run: |
          shasum -a 256 dist/safemaxxing-*.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: safemaxxing-${{ matrix.os }}
          path: |
            dist/safemaxxing-*.tar.gz
            dist/safemaxxing-*.pkg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(find artifacts -type f \( -name 'safemaxxing-*.tar.gz' -o -name 'safemaxxing-*.pkg' \))"
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $files
