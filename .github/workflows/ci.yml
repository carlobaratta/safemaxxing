name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # The wheel's metadata must carry the source version, and its entry point must run.
      - run: |
          expected=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/safemaxxing/__init__.py)
          wheel=$(ls dist/*.whl)
          meta=$(uvx --from "$wheel" python -c 'import importlib.metadata as m; print(m.version("safemaxxing"))')
          echo "wheel metadata: $meta  source: $expected"
          test -n "$expected" && test "$meta" = "$expected"
          uvx --from "$wheel" safemaxxing --help > /dev/null
