name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # Install the wheel with the locked dependencies, so an upstream release cannot break it.
      # Its metadata must carry the source version, and its entry point must run.
      - run: |
          env="$RUNNER_TEMP/wheel-env"
          uv export -q --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/locked.txt"
          uv venv -q "$env"
          uv pip install -q --python "$env" -r "$RUNNER_TEMP/locked.txt" dist/*.whl
          expected=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/safemaxxing/__init__.py)
          meta=$("$env/bin/python" -c 'import importlib.metadata as m; print(m.version("safemaxxing"))')
          echo "wheel metadata: $meta  source: $expected"
          test -n "$expected" && test "$meta" = "$expected"
          "$env/bin/safemaxxing" --help > /dev/null
