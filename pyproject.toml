[project]
name = "safemaxxing"
dynamic = ["version"]
description = "Headless privacy supervisor and egress firewall for macOS, based on sensor-to-network event correlation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "safemaxxing contributors" }]
keywords = ["macos", "privacy", "firewall", "tcc", "pf", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
# Floors are the versions the test suite runs on: the dashboard needs Textual 8's themes and
# breakpoints. All four are MIT/BSD (docs/THIRD_PARTY_LICENSES.md; tests/test_licenses.py).
dependencies = [
    "textual>=8.2.8",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# The menu-bar companion (`safemaxxing menubar`); macOS only. Everything else is headless.
menubar = ["rumps>=0.4.0"]

[project.scripts]
safemaxxing = "safemaxxing.cli:app"

[project.urls]
Homepage = "https://github.com/carlobaratta/safemaxxing"
Source = "https://github.com/carlobaratta/safemaxxing"
Issues = "https://github.com/carlobaratta/safemaxxing/issues"
Changelog = "https://github.com/carlobaratta/safemaxxing/blob/HEAD/CHANGELOG.md"
Security = "https://github.com/carlobaratta/safemaxxing/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version lives in __init__.py: reinstall the editable package when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/safemaxxing/__init__.py" }]
# typer 0.29 requires pydantic and its compiled core for nothing the CLI uses; the lock (and
# so the .pkg build, which runs as root) stays on 0.28 until that changes. Package metadata
# keeps the open range.
constraint-dependencies = ["typer<0.29"]

[tool.hatch.version]
path = "src/safemaxxing/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safemaxxing"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "types-psutil>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests embed verbatim macOS log lines as fixtures.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests"]
mypy_path = "tests"

# rumps (the optional `menubar` extra) ships no type stubs and is absent on Linux/CI.
[[tool.mypy.overrides]]
module = ["rumps"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test gets its own event loop (pytest-asyncio warns when this is left unset).
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a real Mac, root and SAFEMAXXING_LIVE=1"]
# Fail a hung test in seconds instead of letting it burn the whole CI job to its 15-minute
# timeout: the suite runs in a few seconds, so 60 s only ever fires on a real deadlock, and the
# thread method prints the stack of the stuck test (safe with the asyncio and subprocess tests).
timeout = 60
timeout_method = "thread"
