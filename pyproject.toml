[project]
name = "safemaxxing"
version = "0.1.0"
description = "Headless privacy supervisor and egress firewall for macOS, based on sensor-to-network event correlation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "safemaxxing contributors" }]
keywords = ["macos", "privacy", "firewall", "tcc", "pf", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.58.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "psutil>=6.0.0",
]

[project.scripts]
safemaxxing = "safemaxxing.cli:app"

[project.urls]
Homepage = "https://github.com/carlobaratta/safemaxxing"
Source = "https://github.com/carlobaratta/safemaxxing"
Issues = "https://github.com/carlobaratta/safemaxxing/issues"
Changelog = "https://github.com/carlobaratta/safemaxxing/blob/HEAD/CHANGELOG.md"
Security = "https://github.com/carlobaratta/safemaxxing/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safemaxxing"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-psutil>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests embed verbatim macOS log lines as fixtures.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests"]
mypy_path = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs a real Mac, root and SAFEMAXXING_LIVE=1"]
